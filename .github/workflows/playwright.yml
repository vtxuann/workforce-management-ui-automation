name: Playwright Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'Smoke Tests' || 'Regression Tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ORANGEHRM_VERSION: "5.9"
      DB_IMAGE: "orangehrm/orangehrm-db-images:mariadb-10.11.15-ubuntu-22.04"
      DB_NAME: "orangehrm"
      DB_USER: "orangehrm"
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}

      APP_PORT: "8080"
      BASE_URL: "http://localhost:8080"

      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      TEST_SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || 'regression' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start OrangeHRM environment
        run: docker compose up -d

      - name: Bootstrap OrangeHRM
        run: bash scripts/bootstrap-orangehrm.sh

      - name: Wait for OrangeHRM
        shell: bash
        run: |
          echo "Waiting for OrangeHRM login page..."

          for attempt in {1..60}; do
            response="$(curl --silent --location \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$BASE_URL/web/index.php/auth/login" || true)"

            if [ "$response" = "200" ]; then
              echo "OrangeHRM is ready."
              exit 0
            fi

            echo "Attempt $attempt/60: HTTP $response"
            sleep 2
          done

          echo "ERROR: OrangeHRM did not become ready within 120 seconds."
          docker compose ps
          docker compose logs orangehrm
          exit 1

      - name: Type check
        run: npm run typecheck

      - name: Run smoke tests
        if: github.event_name == 'pull_request'
        run: npm run test:smoke

      - name: Run regression tests
        if: github.event_name == 'push'
        run: npm run test:regression

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.TEST_SUITE }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.TEST_SUITE }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup Docker environment
        if: always()
        run: docker compose down -v