services:

  db:
    image: ${DB_IMAGE}
    container_name: workforce-orangehrm-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - orangehrm_db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - orangehrm-network


  orangehrm:
    image: orangehrm/orangehrm:${ORANGEHRM_VERSION}
    container_name: workforce-orangehrm-app
    restart: unless-stopped

    ports:
      - "${APP_PORT}:80"

    environment:
      ORANGEHRM_DATABASE_HOST: db
      ORANGEHRM_DATABASE_USER: ${DB_USER}
      ORANGEHRM_DATABASE_PASSWORD: ${DB_PASSWORD}
      ORANGEHRM_DATABASE_NAME: ${DB_NAME}

    volumes:
      - orangehrm_app_data:/orangehrm

    depends_on:
      db:
        condition: service_healthy

    networks:
      - orangehrm-network


volumes:

  orangehrm_db_data:
    name: workforce-orangehrm-db-data

  orangehrm_app_data:
    name: workforce-orangehrm-app-data


networks:

  orangehrm-network:
    name: workforce-orangehrm-network
    driver: bridge